<main>
<h2>Become a Car Wash Partner</h2>
<p>Partner with MaRL for bulk orders of our Car Wash Soap, including dilution rates and special pricing.</p>

<h3>Bulk Order Inquiry</h3>
<form id="partnerForm">
<label for="companyName">Company Name:</label><br>
<input type="text" id="companyName" name="companyName" required><br><br>

<label for="contactName">Contact Name:</label><br>
<input type="text" id="contactName" name="contactName" required><br><br>

<label for="email">Email:</label><br>
<input type="email" id="email" name="email" required><br><br>

<label for="phone">Phone Number:</label><br>
<input type="tel" id="phone" name="phone" required><br><br>

<label for="orderDetails">Order Details / Quantity:</label><br>
<textarea id="orderDetails" name="orderDetails" rows="4" placeholder="Specify volume, dilution rates, etc." required></textarea><br><br>

<button type="submit">Submit Inquiry</button>
</form>
</main>

<script>
document.getElementById('partnerForm').addEventListener('submit', function(e) {
    e.preventDefault();
    alert('Thank you for your inquiry! Our team will contact you soon.');
});
</script>
